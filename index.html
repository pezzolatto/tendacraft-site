<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TendaCraft - Servidor RPG Urbano</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0F17',
                            card: '#151C28',
                            border: '#2A364F',
                            primary: '#10B981', // Emerald/Neon Green
                            accent: '#00B8D4', // Cyan
                            gold: '#F59E0B'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        title: ['Rajdhani', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F17;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header / Navegação -->
    <header class="border-b border-brand-border bg-brand-dark/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-brand-primary/10 border border-brand-primary/30 p-2.5 rounded-xl text-brand-primary">
                    <i class="fa-solid fa-cube text-xl"></i>
                </div>
                <div>
                    <h1 class="font-title text-2xl font-bold tracking-wider text-white">TENDA<span class="text-brand-primary">CRAFT</span></h1>
                    <p class="text-xs text-slate-400">Servidor RPG Urbano</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Online
                </span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Secção do Mapa (Dynmap) - Ocupa 2 colunas -->
        <section class="lg:col-span-2 bg-brand-card border border-brand-border rounded-2xl overflow-hidden flex flex-col shadow-xl">
            <div class="p-4 border-b border-brand-border flex items-center justify-between bg-brand-dark/50">
                <h2 class="font-title text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-map text-brand-primary">></i> Mapa ao Vivo (Dynmap)
                </h2>
                <span class="text-xs text-slate-400">Mundo TendaCraft</span>
            </div>
            <div class="relative w-full h-[550px] bg-slate-950 flex items-center justify-center">
                <!-- Substitui o src abaixo pelo link web do Dynmap fornecido pela Enxada Host ou integrador -->
                <iframe src="SEU_LINK_DO_DYNMAP_AQUI" 
                        class="w-full h-full border-none" 
                        title="Dynmap TendaCraft">
                </iframe>
            </div>
        </section>

        <!-- Secção do Ranking de Jogadores - Ocupa 1 coluna -->
        <section class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden flex flex-col shadow-xl">
            <div class="p-4 border-b border-brand-border flex items-center justify-between bg-brand-dark/50">
                <h2 class="font-title text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-brand-gold"></i> Top Jogadores
                </h2>
                <span class="text-xs text-slate-400">Ranking</span>
            </div>
            <div class="p-4 flex-grow overflow-y-auto space-y-3">
                <!-- Exemplo de item do ranking (podes preencher dinâmico ou com o ykranks) -->
                <div class="flex items-center justify-between p-3 rounded-xl bg-brand-dark/40 border border-brand-border/50">
                    <div class="flex items-center gap-3">
                        <span class="font-title font-bold text-brand-gold text-lg w-6 text-center">1</span>
                        <div class="w-9 h-9 rounded-lg bg-brand-border flex items-center justify-center text-white font-bold text-sm">
                            P
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-white">Pezzolatto</p>
                            <p class="text-xs text-slate-400">Nível 50</p>
                        </div>
                    </div>
                    <span class="text-xs font-medium text-brand-primary bg-brand-primary/10 px-2.5 py-1 rounded-lg">1420 pts</span>
                </div>
                
                <!-- Podes duplicar este bloco para mais jogadores do ranking -->
            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="border-t border-brand-border bg-brand-dark/50 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 TendaCraft. Todos os direitos reservados. Conectado em <span class="text-slate-400">tendacraft.com.br</span></p>
    </footer>

</body>
</html>
